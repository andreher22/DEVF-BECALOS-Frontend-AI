<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 Registro Digital de Asistentes a Eventos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>🎟️ Registro de Asistentes al Evento</h2>
    <p class="subtitle">Por favor, completa tus datos para digitalizar tu acceso.</p>
    
    <div id="alert-container" class="alert hidden"></div>

    <form id="eventForm" novalidate>
      
      <div class="form-group">
        <label for="name">Nombre Completo *</label>
        <input type="text" id="name" name="name" placeholder="Ej. Mariano Robles">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico *</label>
        <input type="email" id="email" name="email" placeholder="Ej. mariano@example.com">
      </div>

      <div class="form-group">
        <label for="phone">Teléfono de Contacto *</label>
        <input type="tel" id="phone" name="phone" placeholder="Ej. 2411234567 (10 dígitos)">
      </div>

      <div class="form-group">
        <label>Áreas de Interés (Selecciona al menos una) *</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="interests" value="Tecnología"> Inteligencia Artificial & Tech</label>
          <label><input type="checkbox" name="interests" value="Diseño"> Diseño UX/UI & Creatividad</label>
          <label><input type="checkbox" name="interests" value="Marketing"> Marketing & Negocios Digitales</label>
        </div>
      </div>

      <div class="form-group">
        <label>Horario Preferido de Asistencia *</label>
        <div class="radio-group">
          <label><input type="radio" name="schedule" value="Matutino" checked> Matutino (09:00 - 13:00)</label>
          <label><input type="radio" name="schedule" value="Vespertino"> Vespertino (14:00 - 18:00)</label>
        </div>
      </div>

      <div class="form-group">
        <label for="eventDate">Fecha de Asistencia Seleccionada *</label>
        <input type="date" id="eventDate" name="eventDate">
      </div>

      <div class="form-group">
        <label for="idFile">Documento de Identificación (Opcional - PDF o Imagen)</label>
        <input type="file" id="idFile" name="idFile" accept="image/*,.pdf">
      </div>

      <button type="submit" id="btn-submit">Finalizar Registro 🚀</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
