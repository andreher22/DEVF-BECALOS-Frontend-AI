<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛡️ Registro Seguro - Validación con Zod</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-form">
    <h2>🔑 Creación de Cuenta</h2>
    <p class="subtitle">Validación de esquemas de datos robustos en tiempo real.</p>

    <div id="success-alert" class="alert success hidden"></div>

    <form id="registerForm" novalidate>
      
      <div class="form-control">
        <label for="name">Nombre Completo</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre y apellidos">
        <span class="error-text" id="error-name"></span>
      </div>

      <div class="form-control">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
        <span class="error-text" id="error-email"></span>
      </div>

      <div class="form-control">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres">
        <span class="error-text" id="error-password"></span>
      </div>

      <button type="submit" id="btn-submit">Registrarse Ahora 🚀</button>
    </form>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
