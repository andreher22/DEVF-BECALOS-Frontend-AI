<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛸 Rick & Morty API - Fetch vs Axios</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #202329;
      color: #fff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #11b0c8;
      margin-bottom: 5px;
    }
    .subtitle {
      color: #9e9e9e;
      margin-top: 0;
      font-size: 14px;
    }
    .buttons-container {
      margin: 25px 0;
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    button {
      background-color: #3c3e44;
      color: #ff9800;
      border: 2px solid #ff9800;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #ff9800;
      color: #202329;
      box-shadow: 0 0 15px rgba(255, 152, 0, 0.4);
    }
    #data-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 15px;
    }
    .character-card {
      background-color: #3c3e44;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .character-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }
    .character-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .character-card h3 {
      margin: 15px 10px 5px 10px;
      font-size: 18px;
      color: #f5f5f5;
    }
    .character-card p {
      margin: 5px 10px;
      font-size: 14px;
      color: #9e9e9e;
    }
    .status-container {
      margin-bottom: 15px;
      margin-top: 10px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
    }
    .status-alive { background-color: #55cc44; color: #fff; }
    .status-dead { background-color: #d63d2e; color: #fff; }
    .status-unknown { background-color: #9e9e9e; color: #fff; }
    
    .loader { font-size: 20px; color: #11b0c8; grid-column: 1 / -1; margin: 40px 0; }
    .error-msg { color: #ff5252; grid-column: 1 / -1; font-size: 18px; margin: 40px 0; line-height: 1.6; }
  </style>
</head>
<body>

  <h1>🛸 Dimension C-137: Characters Inventory</h1>
  <p class="subtitle">Proyecto de Comparación HTTP: Native Fetch API vs Axios Library</p>

  <div class="buttons-container">
    <button id="btn-fetch">Get con Fetch 🌐</button>
    <button id="btn-axios">Get con Axios 🚀</button>
  </div>

  <div id="data-container">
    <p style="grid-column: 1 / -1; color: #9e9e9e; font-style: italic;">Presiona cualquiera de los botones de arriba para despertar a los científicos...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
